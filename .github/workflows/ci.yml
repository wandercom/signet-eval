name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Formatting
        run: cargo +stable fmt --all --check
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Claude adapter recovery contract
        run: |
          node tests/claude_adapter_recovery.mjs adapters/claude-function/hooks/signet.ts
          node tests/claude_host_errors.mjs adapters/claude-function/hooks/signet.ts
      - name: Tests with MCP
        # The suite includes wall-clock budgets. Exercise optimized code without
        # contending with the suite's Argon2 tests on shared runners.
        run: cargo +stable test --workspace --release --locked --no-fail-fast -- --test-threads=1
      - name: Tests without MCP
        run: cargo +stable test --workspace --release --locked --no-default-features --no-fail-fast -- --test-threads=1
      - name: Release binary
        run: cargo +stable build --release --locked
      - name: Verify packaged source and embedded adapter
        run: cargo +stable package --locked
